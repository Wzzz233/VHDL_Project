<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <title>PPLCNet Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <h1>PPLCNet Live</h1>
      <span id="connectionState" class="connection" data-state="pending">正在连接</span>
    </div>
    <div class="pipeline-actions" aria-label="推理流程">
      <button id="pausePipeline" class="quiet-button" type="button">暂停</button>
      <button id="resumePipeline" class="quiet-button" type="button">继续</button>
      <button id="restartPipeline" class="quiet-button danger-action" type="button">重启</button>
    </div>
  </header>

  <main class="workspace">
    <section class="viewer" aria-label="图片识别结果">
      <div id="cameraStage" class="camera-stage">
        <img id="framePreview" width="640" height="360" data-ready="false" alt="图片识别结果">
        <canvas id="detectionOverlay" aria-hidden="true"></canvas>
        <div id="frameState" class="frame-state">请选择图片进行识别</div>
      </div>
      <div class="viewer-status">
        <div>
          <span class="status-label">期望输入</span>
          <strong id="desiredSource">--</strong>
        </div>
        <div>
          <span class="status-label">当前输入</span>
          <strong id="activeSource">--</strong>
        </div>
        <div class="failover-line">
          <span class="status-label">切换状态</span>
          <strong id="failoverReason">--</strong>
        </div>
      </div>
    </section>

    <aside class="control-rail">
      <section class="control-section source-section" aria-labelledby="sourceHeading">
        <h2 id="sourceHeading">视频输入</h2>
        <div id="sourceSelector" class="segmented" role="radiogroup" aria-label="视频输入">
          <button type="button" role="radio" aria-checked="false" data-source="fpga">OV5640</button>
          <button type="button" role="radio" aria-checked="false" data-source="phone">手机</button>
        </div>
        <div class="camera-control">
          <button id="phoneCameraToggle" class="primary-button" type="button">启动手机摄像头</button>
          <span id="phoneCameraState" class="inline-state" data-state="idle">未启动</span>
        </div>
        <video id="publisherVideo" muted playsinline hidden></video>
      </section>

      <section class="control-section image-section" aria-labelledby="imageHeading">
        <h2 id="imageHeading">图片识别</h2>
        <div id="imageModeSelector" class="segmented" role="radiogroup" aria-label="图片识别模式">
          <button type="button" role="radio" aria-checked="true" data-image-mode="plate">车牌</button>
          <button type="button" role="radio" aria-checked="false" data-image-mode="pedestrian">行人</button>
        </div>
        <input id="imageFile" class="image-file" type="file" accept="image/jpeg,image/png">
        <div class="image-actions">
          <button id="runImageInference" class="primary-button" type="button" disabled>上传并识别</button>
          <button id="returnLiveView" class="quiet-button" type="button" hidden>关闭图片结果</button>
        </div>
        <span id="imageInferenceState" class="inline-state" data-state="idle">未选择图片</span>
      </section>

      <section class="control-section sd-section" aria-labelledby="sdHeading">
        <h2 id="sdHeading">SD 卡文件</h2>
        <div class="sd-path-bar">
          <span class="status-label">当前路径</span>
          <strong id="sdCurrentPath">/</strong>
          <button id="sdRefresh" class="quiet-button" type="button">刷新</button>
        </div>
        <div id="sdFileList" class="sd-file-list" aria-live="polite">
          <p class="empty-result">未加载</p>
        </div>
        <div class="sd-selection">
          <span class="status-label">选中文件</span>
          <strong id="sdSelectedName">--</strong>
        </div>
        <div class="sd-actions">
          <button id="runSdPhotoInference" class="primary-button" type="button" disabled>识别照片</button>
          <button id="generateSdVideoMask" class="primary-button" type="button" disabled>生成 Mask</button>
          <button id="runSdVideoInference" class="primary-button" type="button" disabled>开始屏幕推理</button>
        </div>
        <span id="sdBrowseState" class="inline-state" data-state="idle">未加载</span>
        <div id="sdVideoResult" class="sd-video-result" hidden>
          <div class="sd-video-progress">
            <span id="sdVideoProgressLabel" class="inline-state" data-state="idle">--</span>
            <progress id="sdVideoProgress" max="1" value="0"></progress>
          </div>
        </div>
      </section>

      <section class="control-section" aria-labelledby="metricsHeading">
        <h2 id="metricsHeading">运行状态</h2>
        <dl class="metrics">
          <div><dt>输入 FPS</dt><dd id="inputFps">--</dd></div>
          <div><dt>解码 FPS</dt><dd id="decodeFps">--</dd></div>
          <div><dt>推理 FPS</dt><dd id="inferFps">--</dd></div>
          <div><dt>画面帧龄</dt><dd id="frameAge">--</dd></div>
          <div><dt>输入丢帧</dt><dd id="inputDrops">--</dd></div>
          <div><dt>解码丢帧</dt><dd id="decodeDrops">--</dd></div>
          <div><dt>推理丢帧</dt><dd id="inferDrops">--</dd></div>
          <div><dt>显示丢帧</dt><dd id="displayDrops">--</dd></div>
        </dl>
      </section>

      <section class="control-section results-section" aria-labelledby="resultsHeading">
        <div class="section-heading">
          <h2 id="resultsHeading">识别结果</h2>
          <span id="detectionCount" class="count">0</span>
        </div>
        <div id="resultList" class="result-list" aria-live="polite">
          <p class="empty-result">暂无车牌</p>
        </div>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
