<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGP Live Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>BGP Live Control</h1>
      <p id="summary">waiting for status</p>
    </div>
    <div class="actions">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>
  </header>

  <main>
    <section class="preview">
      <div class="stage">
        <img id="frame" alt="preview">
        <canvas id="overlay"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Controls</h2>
      <label>Display every
        <select id="displayEvery">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>FPS
        <input id="fps" type="number" min="1" max="120" value="30">
      </label>
      <label>Preview FPS
        <input id="previewFps" type="number" min="0" max="30" value="5">
      </label>
      <label>DMA pre-delay us
        <input id="dmaDelay" type="number" min="0" max="1000000" value="0">
      </label>
      <label class="checkbox">
        <input id="noInfer" type="checkbox">
        no infer
      </label>
      <button id="applyBtn">Apply</button>
    </section>

    <section class="panel results">
      <h2>Results</h2>
      <div id="results">no result</div>
    </section>

    <section class="panel log">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
